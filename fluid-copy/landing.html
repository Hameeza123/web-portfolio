<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamza Hussain / Landing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script>
    document.documentElement.classList.add('flame-on');
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --ink: #0f0f0f;
      --cover: 'Helvetica Neue', Helvetica, 'Inter', Arial, sans-serif;
      --accent: #e6392f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body { display: flex; align-items: stretch; justify-content: flex-start; position: relative; }
    img.full {
      height: 100vh; width: auto; object-fit: contain; display: block;
    }
    #flame-canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }
    .flame-on img.full { visibility: hidden; }
    html:not(.flame-on) #flame-canvas { display: none; }

    .text-stack {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      color: var(--ink);
      z-index: 2;
      max-width: 60vw;
      font-family: 'Space Mono', monospace;
    }
    .text-main {
      position: relative;
      display: inline-block;
      font-family: var(--cover);
      font-weight: 700;
      font-style: italic;
      font-size: clamp(2.8rem, 3.9vw, 3.7rem);
      letter-spacing: -0.01em;
      line-height: 1.15;
      text-align: right;
      white-space: nowrap;
      color: var(--ink);
      opacity: 0;
      transform: translateY(8px);
      animation: fadeSlide 0.8s ease forwards;
      animation-delay: 1.2s;
    }
    .subtext {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 1.8vw, 1.4rem);
      font-family: var(--cover);
      font-weight: 700;
      font-style: italic;
      color: var(--ink);
      text-decoration: none;
      padding: 4px 0;
      overflow: visible;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeSlide 0.8s ease forwards;
      animation-delay: 1.8s;
    }
    .subtext::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 1px;
      width: 100%;
      background: var(--ink);
      transform-origin: left;
      transform: scaleX(0);
      transition: transform 180ms ease;
    }
    .subtext:hover::after { transform: scaleX(1); }

    /* lettering from the Metaphorical Music sleeve: bold italic grotesque, first name grey */
    .text-main .first { color: #6b6b6b; }

    .text-stack { animation: floaty 7s ease-in-out infinite; }
    @keyframes floaty {
      0% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0); }
    }

    @media (min-aspect-ratio: 16/10) {
      .text-stack { top: 50%; transform: translateY(-50%); bottom: auto; right: 150px; align-items: flex-end; }
    }
    @media (max-aspect-ratio: 16/10) and (min-aspect-ratio: 1/1) {
      .text-stack { top: auto; transform: none; bottom: 200px; right: 200px; align-items: flex-end; }
    }
    @media (max-aspect-ratio: 1/1) {
      .text-stack {
        top: auto;
        transform: none;
        bottom: 90px;
        left: 0; right: 0;
        max-width: none;
        align-items: center;
        gap: 4px;
        animation: floaty 6s ease-in-out infinite;
      }
      .text-main { text-align: center; font-size: clamp(2.3rem, 9.6vw, 3rem); white-space: nowrap; }
      .subtext { text-align: center; }
    }

    @keyframes blink { 50% { background: transparent; } }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <img class="full" src="photos/landing/nujabes.jpg" alt="Nujabes" />
  <canvas id="flame-canvas" data-src="photos/landing/nujabes-cutout.webp" aria-hidden="true"></canvas>
  <div class="text-stack">
    <div class="text-main"><span class="first">Hamza</span>&nbsp;Hussain</div>
    <a class="subtext" href="index.html">go!</a>
  </div>
  <script src="flame-bloom.js"></script>
</body>
</html>
