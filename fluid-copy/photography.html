<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos / Hamza Hussain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    /* Photos fill the screen edge to edge; the only chrome is small mono labels in the corners. */
    :root {
      --bg: #0e0d0c;
      --ink: #f2eee7;
      --muted: rgba(242, 238, 231, 0.62);
      --scrim: rgba(10, 9, 8, 0.55);
      --mono: 'Space Mono', ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
    }
    a, button { color: inherit; font: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

    .corner {
      position: fixed;
      z-index: 5;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      text-decoration: none;
      color: var(--ink);
      text-shadow: 0 1px 8px var(--scrim);
      opacity: 0.85;
      transition: opacity 160ms ease;
    }
    .corner:hover { opacity: 1; }
    .corner.tl { top: 18px; left: 20px; }

    /* ── Album picker ── */
    .albums[hidden] { display: none; }
    .albums {
      position: fixed; inset: 0;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
    }
    .album {
      position: relative;
      display: block;
      overflow: hidden;
      text-decoration: none;
    }
    .album img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transform: scale(1.01);
      transition: transform 900ms cubic-bezier(.22,.61,.36,1), filter 400ms ease;
      filter: brightness(0.86);
    }
    .album:hover img, .album:focus-visible img { transform: scale(1.04); filter: brightness(1); }
    .album-label {
      position: absolute;
      left: 0; right: 0; bottom: 22px;
      text-align: center;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      text-shadow: 0 1px 10px var(--scrim);
    }
    .album-label span { color: var(--muted); margin-left: 0.8em; }
    .album-label small {
      display: block;
      margin-top: 6px;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    /* ── Album strip: every photo at full height (never cropped), scrolled sideways freely ── */
    .show { position: fixed; inset: 0; background: var(--bg); }
    .strip {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .strip::-webkit-scrollbar { display: none; }
    .strip img {
      flex: none;
      display: block;
      /* always full height: the strip scrolls, so a photo wider than the screen is still seen whole */
      height: 100dvh;
      width: auto;
      aspect-ratio: var(--a);
      background: #1a1816;
    }

    .next {
      position: fixed;
      right: 18px; bottom: 16px;
      z-index: 5;
      width: 44px; height: 44px;
      display: grid; place-items: center;
      opacity: 0.85;
      filter: drop-shadow(0 1px 6px var(--scrim));
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .next:hover { opacity: 1; transform: translateX(3px); }
    .next svg { width: 26px; height: 14px; }
    .count {
      position: fixed;
      left: 20px; bottom: 28px;
      z-index: 5;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      text-shadow: 0 1px 8px var(--scrim);
    }

    @media (max-aspect-ratio: 1/1) {
      .albums { grid-auto-flow: row; grid-auto-rows: 1fr; }
      /* on a tall phone screen, shrink landscapes to the screen width instead */
      .strip img { height: min(100dvh, calc(100vw / var(--a))); }
    }
    @media (prefers-reduced-motion: reduce) {
      .album img { transition: none; }
      .strip { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <a class="corner tl" id="back" href="index.html">Hamza Hussain</a>

  <nav class="albums" id="albums" aria-label="Albums"></nav>

  <section class="show" id="show" hidden aria-label="Photos">
    <div class="strip" id="strip" tabindex="-1"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <button class="next" id="next" aria-label="Next photos">
      <svg viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M0 7h24M18 1l6 6-6 6"/></svg>
    </button>
  </section>

  <script>
    // load the album list fresh every visit, so edits to albums.js show up on a normal refresh
    document.write('<script src="photos/photography/albums.js?' + Date.now() + '"><\/script>');
  </script>
  <script>
    (() => {
      const ALBUMS = window.PHOTO_ALBUMS;
      const $ = id => document.getElementById(id);
      const albumsEl = $('albums'), showEl = $('show'), strip = $('strip');
      const back = $('back');

      // album picker
      for (const [slug, a] of Object.entries(ALBUMS)) {
        const cover = a.photos.find(p => p.src === a.cover) || a.photos[0];
        const link = document.createElement('a');
        link.className = 'album';
        link.href = '#' + slug;
        link.innerHTML = `<img src="${cover.src}" alt="">` +
          `<p class="album-label">${a.title}<span>${a.photos.length}</span>` +
          (a.camera ? `<small>${a.camera}</small>` : '') + `</p>`;
        albumsEl.appendChild(link);
      }

      let album = null, imgs = [];
      const pad = n => String(n).padStart(2, '0');
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

      function render() {
        strip.innerHTML = '';
        imgs = album.photos.map((p, k) => {
          const img = new Image();
          img.alt = '';
          img.decoding = 'async';
          img.loading = k < 4 ? 'eager' : 'lazy';
          img.width = p.w; img.height = p.h;
          img.style.setProperty('--a', (p.w / p.h).toFixed(4));
          img.src = p.src;
          strip.appendChild(img);
          return img;
        });
        stop();
        strip.scrollLeft = 0;
        update();
      }

      // the photo at the left edge of the screen (for the counter)
      function current() {
        const x = strip.scrollLeft + 2;
        const k = imgs.findIndex(img => img.offsetLeft + img.offsetWidth > x);
        return k < 0 ? imgs.length - 1 : k;
      }
      function update() {
        $('count').textContent = `${album.title} · ${pad(current() + 1)} / ${pad(imgs.length)}`;
      }

      // One scroller for wheel, trackpad, keys and the arrow button. It keeps a precise (float) target
      // and eases toward it every frame: scrollLeft rounds to whole pixels, so feeding it small or
      // uneven wheel deltas directly is what made slow scrolling choppy.
      const held = new Set();
      let pos = 0, target = 0, vel = 0, last = 0, running = false;
      const maxX = () => strip.scrollWidth - strip.clientWidth;
      const clamp = x => Math.max(0, Math.min(maxX(), x));
      const dirOf = k => (k === 'ArrowRight' || k === 'ArrowDown') ? 1 : (k === 'ArrowLeft' || k === 'ArrowUp') ? -1 : 0;

      function start() {
        if (running) return;
        pos = target = strip.scrollLeft;
        running = true;
        last = performance.now();
        requestAnimationFrame(tick);
      }
      function stop() {
        running = false;
        vel = 0;
        held.clear();
      }
      function tick(now) {
        if (!running) return;
        const dt = Math.max(0, Math.min(0.05, (now - last) / 1000 || 0));
        last = now;
        // held arrow keys: velocity eases up to speed and back down on release
        let dir = 0;
        held.forEach(k => { dir += dirOf(k); });
        const top = Math.sign(dir) * Math.min(innerWidth * 1.4, 1600);
        vel += (top - vel) * Math.min(1, dt * (dir ? 5 : 10));
        target = clamp(target + vel * dt);
        pos += (target - pos) * (still ? 1 : 1 - Math.exp(-dt * 12));
        if (Math.abs(target - pos) < 0.1) pos = target;
        strip.scrollLeft = pos;
        if (dir || Math.abs(vel) > 2 || pos !== target) requestAnimationFrame(tick);
        else stop();
      }
      function moveBy(dx) { start(); target = clamp(target + dx); }
      function moveTo(x) { start(); target = clamp(x); }

      // the arrow button and Page keys move most of a screen; the strip stops wherever it lands
      function page(dir) {
        if (dir > 0 && strip.scrollLeft >= maxX() - 2) return moveTo(0);
        moveBy(dir * strip.clientWidth * 0.85);
      }

      function route() {
        const slug = location.hash.slice(1);
        album = ALBUMS[slug] || null;
        albumsEl.hidden = !!album;
        showEl.hidden = !album;
        back.textContent = album ? 'Albums' : 'Hamza Hussain';
        back.href = album ? '#' : 'index.html';
        if (album) render();
      }

      $('next').addEventListener('click', () => page(1));
      addEventListener('keydown', e => {
        if (!album) return;
        if (dirOf(e.key)) { e.preventDefault(); held.add(e.key); start(); }
        else if (e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); page(e.shiftKey ? -1 : 1); }
        else if (e.key === 'PageUp') { e.preventDefault(); page(-1); }
        else if (e.key === 'Home') { e.preventDefault(); moveTo(0); }
        else if (e.key === 'End') { e.preventDefault(); moveTo(maxX()); }
        else if (e.key === 'Escape') location.hash = '';
      });
      addEventListener('keyup', e => held.delete(e.key));
      addEventListener('blur', () => held.clear());
      // scrolling down with a mouse wheel or trackpad moves the strip sideways, anywhere on the page
      showEl.addEventListener('wheel', e => {
        if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        e.preventDefault();
        moveBy(e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY);
      }, { passive: false });
      // touch and scrollbar drags stay native: hand control back to them
      strip.addEventListener('pointerdown', stop);
      strip.addEventListener('touchstart', stop, { passive: true });
      strip.addEventListener('scroll', update, { passive: true });
      addEventListener('hashchange', route);
      route();
    })();
  </script>
</body>
</html>
